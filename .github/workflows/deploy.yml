name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Pinned: Playwright's browser install (--with-deps) doesn't support Ubuntu 26 yet,
    # which ubuntu-latest moved to in October 2026.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Served at the root of the custom domain (hearttosoulpsychotherapy.ca).
      # build:seo = vite build, 404.html SPA fallback, then prerender every page
      # to real HTML (for search engines / AI assistants) and write sitemap.xml.
      - run: npm run build:seo
        env:
          BASE_PATH: /
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
